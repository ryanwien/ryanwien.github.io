name: thesistrace

# Tests ThesisTrace only; the rest of the site is static and has nothing to run.
on:
  push:
    branches: [main]
    paths: ["thesistrace/**", ".github/workflows/thesistrace.yml"]
  pull_request:
    paths: ["thesistrace/**", ".github/workflows/thesistrace.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: thesistrace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: thesistrace/requirements.txt
      - run: pip install -r requirements.txt -e .
      - run: ruff check . && ruff format --check .
      - run: pytest
      - name: End-to-end run
        if: matrix.python-version == '3.14'
        run: python -m "$(cat .run)"
